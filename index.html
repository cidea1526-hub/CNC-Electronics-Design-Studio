<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CNC Electronics Design Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: drafting-table app. Left rail = machine library, centre = diagram sheet, right drawer = part / wire detail. */
:root{
  --bg:#e8edef; --panel:#f6f8f9; --ink:#10222b; --muted:#566b74; --line:#c3cfd4;
  --accent:#0a6f6b; --accent-ink:#ffffff; --sheet:#fbfcfc; --grid:#e3eaed;
  --ok:#17794a; --warn:#a85a05; --bad:#b42318; --info:#2a5db0;
  --w-pwr:#d93a3f; --w-gnd:#1b2a31; --w-step:#1f9d57; --w-dir:#2f6fe0; --w-en:#12805a; --w-lim:#c79300;
  --w-spn:#e07a1a; --w-fb:#7c4ddb; --w-mot:#0e9aa0; --w-usb:#6b7c85; --w-therm:#b0489a; --w-heat:#c7511f;
  --sans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c181e; --panel:#13242c; --ink:#dce8ec; --muted:#8ba2ac; --line:#26404a;
  --accent:#41c7bc; --accent-ink:#06201e; --sheet:#0f1e25; --grid:#162a33;
  --ok:#4cc58a; --warn:#e0a24a; --bad:#ff7a6e; --info:#7fa8f0; --w-gnd:#9fb4bc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c181e; --panel:#13242c; --ink:#dce8ec; --muted:#8ba2ac; --line:#26404a;
  --accent:#41c7bc; --accent-ink:#06201e; --sheet:#0f1e25; --grid:#162a33;
  --ok:#4cc58a; --warn:#e0a24a; --bad:#ff7a6e; --info:#7fa8f0; --w-gnd:#9fb4bc; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.brand span{color:var(--muted);font-size:12px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.crumbs b{color:var(--ink);font-weight:500}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:6px;min-width:0}
button.tile:hover{border-color:var(--accent)}
.tile h3{margin:0;font-size:15px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:12.5px}
.tile svg{width:40px;height:40px;color:var(--accent)}
.badge{display:inline-block;align-self:flex-start;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;font-weight:500;white-space:nowrap}
.b-pre{color:var(--warn)} .b-ok{color:var(--ok)} .b-inc{color:var(--bad)} .b-plan{color:var(--muted)} .b-info{color:var(--info)}
h2.sec{font-size:16px;margin:4px 0 0;font-weight:600}
.note{background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--warn);border-radius:6px;padding:9px 12px;font-size:12.5px;color:var(--muted)}
.tiers{display:flex;flex-wrap:wrap;gap:8px}
.tiers .btn{display:flex;gap:8px;align-items:center}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center}
.toolbar label{display:flex;gap:5px;align-items:center;font-size:12.5px;padding:2px 6px}
.canvas{height:min(72vh,720px);min-height:380px;touch-action:none;cursor:grab;direction:ltr;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.canvas.drag{cursor:grabbing}
.canvas svg{width:100%;height:100%;display:block;direction:ltr;font-family:var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 10px;border-top:1px solid var(--line);font-size:12px;direction:ltr}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-inline-end:5px}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.drawer h3{margin:0;font-size:15px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:12px;direction:ltr;unicode-bidi:isolate}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:start;padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.chk .d{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-err{background:var(--bad)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:5px;border:1px solid var(--line)}
.exports{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast div{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;max-width:90vw}
svg .cmp{cursor:pointer}
svg .wire{cursor:pointer;fill:none;stroke-linejoin:round}
svg text{user-select:none}
@media (prefers-reduced-motion:no-preference){.btn,.tile{transition:border-color .15s}}
</style>

/* ===== Circuit Diagram Validation Engine ===== */
function validate(c){
  const R=[];const add=(lvl,txt)=>R.push({lvl,txt});
  const G=geom(c),ids=Object.fromEntries(c.instances.map(i=>[i.id,i]));
  // 1. endpoints exist
  let bad=0;c.conns.forEach(k=>{[k.a,k.b].forEach(e=>{const [i,p]=split(e);if(!ids[i]||!G[i].pins[p]){bad++;add('err',`Connection endpoint ${e} does not exist in the component model.`);}});});
  if(!bad)add('ok',`All ${c.conns.length} connection endpoints exist in their component pin tables.`);
  // 2. pin reuse + wire class
  const use={};c.conns.forEach(k=>{[k.a,k.b].forEach(e=>{(use[e]=use[e]||[]).push(k);});});
  let dup=0;Object.entries(use).forEach(([e,l])=>{const cls=l[0].cls;if(l.length>1&&!['power','gnd','v5','en','lim'].includes(cls)){dup++;add('err',`Pin ${e} is wired ${l.length} times (${cls}).`);}});
  if(!dup)add('ok','No signal pin is wired to more than one destination.');
  let mism=0;c.conns.forEach(k=>{const [ai,ap]=split(k.a),[bi,bp]=split(k.b);if(!G[ai]||!G[bi]||!G[ai].pins[ap]||!G[bi].pins[bp])return;
    if(G[ai].pins[ap].p.cls!==k.cls&&G[bi].pins[bp].p.cls!==k.cls){mism++;add('warn',`Wire ${k.net} (${k.cls}) joins pins of other classes: ${k.a}, ${k.b}.`);}});
  if(!mism)add('ok','Each wire class matches the function of at least one of its pins.');
  // 3. nets + voltage
  const par={};const f=x=>(par[x]===undefined?(par[x]=x):par[x]===x?x:(par[x]=f(par[x])));const un=(a,b)=>{par[f(a)]=f(b);};
  c.conns.forEach(k=>un(k.a,k.b));
  c.instances.forEach(i=>(model(i).thru||[]).forEach(([a,b])=>un(i.id+'.'+a,i.id+'.'+b)));
  const netV={};c.instances.forEach(i=>{const m=model(i);m.pins.forEach(p=>{if(p.v)netV[f(i.id+'.'+p.id)]=p.v;});});
  let vchk=0,vbad=0;c.instances.forEach(i=>model(i).pins.forEach(p=>{if(p.vmin===undefined)return;const v=netV[f(i.id+'.'+p.id)];
    if(v===undefined)return;vchk++;if(v<p.vmin||v>p.vmax){vbad++;add('err',`${i.label} ${p.id}: supplied ${v} V, allowed ${p.vmin}–${p.vmax} V.`);}}));
  if(vchk&&!vbad)add('ok',`${vchk} supply pins checked: every one is inside its documented voltage range.`);
  // 4. motor-driver current
  c.conns.filter(k=>k.cls==='mot').forEach(k=>{});
  const pairs=new Set();c.conns.filter(k=>k.cls==='mot').forEach(k=>{const [ai]=split(k.a),[bi]=split(k.b);pairs.add(ai+'>'+bi);});
  pairs.forEach(p=>{const [d,m]=p.split('>');const dm=model(ids[d]),mm=model(ids[m]);
    if(dm.imax==null||mm.imax==null)add('warn',`${ids[d].label} → ${ids[m].label}: current rating not confirmed, cannot compare.`);
    else if(mm.imax>dm.imax)add('err',`${ids[m].label} needs ${mm.imax} A but ${ids[d].label} supplies at most ${dm.imax} A.`);
    else add('ok',`${ids[d].label} (${dm.imax} A max) can drive ${ids[m].label} (${mm.imax} A).`);});
  // 5. psu capacity
  const psus=c.instances.filter(i=>model(i).type==='psu');
  if(psus.length){const load=c.instances.reduce((s,i)=>s+(model(i).type==='psu'?0:model(i).power||0),0),cap=psus.reduce((s,i)=>s+model(i).power,0),r=cap/load;
    add(r>=1.25?'ok':(r>=1?'warn':'err'),`Estimated DC load ${load} W against ${cap} W of supply${psus.length>1?' ('+psus.length+' supplies combined)':''} (${r.toFixed(2)}× margin, 1.25× wanted). Load values are assumptions.`);}
  // 6. protection
  add(c.instances.some(i=>model(i).type==='fuse')?'ok':'err',c.instances.some(i=>model(i).type==='fuse')?'A main fuse is present.':'No main fuse in the circuit.');
  if(c.cat==='engraver'||c.cat==='router'||c.cat==='mill'||c.cat==='laser')
    add(c.instances.some(i=>model(i).type==='estop')?'ok':'err',c.instances.some(i=>model(i).type==='estop')?'An emergency stop opens the motor and spindle supply.':'No emergency stop in the circuit.');
  if(c.cat==='laser'){const il=c.instances.some(i=>i.m==='interlock');add(il?'ok':'err',il?'A door interlock is in series with the laser supply.':'No door interlock on the laser supply.');
    add('warn','Laser safety: the diode beam can blind and burn. Use an enclosure, rated eyewear and a keyed enable. Interlock and e-stop behaviour must be tested with the laser powered but the beam blocked. This sheet does not replace that test.');}
  if(c.cat==='router')add('warn','The spindle VFD runs from mains. The e-stop shown opens only the DC side; add a contactor or VFD safe-stop input so the e-stop also stops the spindle.');
  if(c.cat==='printer')add('warn','Thermal-runaway protection is a firmware setting and cannot be shown in the wiring. Enable it before heating.');
  if(c.cat==='printer')add('warn','RAMPS 5 A input: hotend (≈3.3 A) + fan + four motors may exceed 5 A. Measure the real current. The bed (≈10 A) is close to the 11 A limit.');
  // 7. unconnected pins on passive parts
  let un0=0;c.instances.forEach(i=>{const m=model(i);if(['mcu','psu','pc'].includes(m.type))return;m.pins.forEach(p=>{if(!use[i.id+'.'+p.id]&&!(m.optional||[]).includes(p.id)){un0++;add('warn',`${i.label} pin ${p.id} is not connected.`);}});});
  if(!un0)add('ok','Every required pin on drivers, motors, switches and loads is connected.');
  // 8. pin data quality
  const unv=c.instances.filter(i=>model(i).pinStatus==='unverified');
  if(unv.length)add('err',`${unv.length} component(s) have unconfirmed pin names: ${[...new Set(unv.map(i=>model(i).model))].join(', ')}. The sheet is not an exact wiring diagram.`);
  const gen=c.instances.filter(i=>model(i).generic);
  if(gen.length)add('warn',`${gen.length} part(s) are generic assumptions (${[...new Set(gen.map(i=>i.label))].slice(0,6).join(', ')}…). Select real part numbers and re-check ratings.`);
  (c.todo||[]).forEach(t=>add('err','Open item: '+t));
  // 9. drawing vs table
  const d=drawCircuit(c,{}),gg=d.G;let mis=0;d.ends.forEach(([n,key,x,y])=>{const k=c.conns[n],P=gg[split(key==='a'?k.a:k.b)[0]].pins[split(key==='a'?k.a:k.b)[1]];if(!P||Math.abs(P.x-x)>.01||Math.abs(P.y-y)>.01)mis++;});
  add(mis?'err':'ok',mis?`${mis} wire ends in the drawing do not land on their pin.`:`Drawing check: all ${d.ends.length} wire ends land exactly on the pins named in the connection table.`);

  const errs=R.filter(r=>r.lvl==='err').length,warns=R.filter(r=>r.lvl==='warn').length;

  const why=errs?`${errs} blocking issue(s) found.`:`Automatic checks pass${warns?` with ${warns} warning(s)`:''}. "Verified" needs a person to compare every pin with the cited datasheets, and no such review is recorded.`;

      C(`de1.${N.c1}`,'me1.1A','E1_1A','mot'),C(`de1.${N.c2}`,'me1.1B','E1_1B','mot'),C(`de1.${N.c3}`,'me1.2A','E1_2A','mot'),C(`de1.${N.c4}`,'me1.2B','E1_2B','mot'),

    cols.forEach(([t,w],i)=>{x.strokeRect(cx,y,w,h);x.fillStyle='#10222b';if(i===0)x.strokeRect(cx+9,y+h/2-11,22,22);else L[i].forEach((l,j)=>x.fillText(l,cx+8,y+30+j*26));cx+=w;});y+=h;};
  page();parts.forEach(row);sect('مستلزمات إضافية (غير مرسومة في المخطط)');extra.forEach(row);
  y+=34;if(y>H-M-20)page();x.fillStyle='#10222b';x.font='600 22px '+F;x.fillText('إجمالي القطع المرسومة: '+parts.reduce((a,r)=>a+r.qty,0)+'        الإجمالي الكلي: ______________',M,y);
  const pdf=new J.jsPDF({orientation:'portrait',unit:'pt',format:'a4'}),PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight();
  pages.forEach((p,i)=>{if(i)pdf.addPage('a4','portrait');pdf.addImage(p.toDataURL('image/jpeg',.92),'JPEG',0,0,PW,PH);});
  return pdf.output('blob');
}
async function pngBlob(c){const svg=exportSVG(c),m=svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/),vw=+m[1],vh=+m[2],sc=Math.min(3,8000/Math.max(vw,vh));
  const cv=await svgToCanvas(svg,Math.round(vw*sc),Math.round(vh*sc));return new Promise(r=>cv.toBlob(r,'image/png'));}
async function saveFile(name,data){if(DL){await DL.save({filename:name,data});return;}const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
async function doExport(k){
  const c=cur();
  try{
    let name,data;
    if(k==='svg'){name=fname(c,'svg');data=exportSVG(c);}
    else if(k==='csv-comp'){name=fname(c,'csv','-components');data=compCSV(c);}
    else if(k==='csv-pp'){name=fname(c,'csv','-pin-to-pin');data=ppCSV(c);}
    else if(k==='csv-bom'){name=fname(c,'csv','-bom');data=bomCSV(c);}
    else if(k==='fw'){name=fname(c,'json','-firmware');data=fwJSON(c);}
    else if(k==='pdf'){name=fname(c,'pdf');data=await pdfBlob(c);}
    else if(k==='png'){name=fname(c,'png');data=await pngBlob(c);}
    else if(k==='shop-pdf'){name=fname(c,'pdf','-shopping-list');data=await shopPdfBlob(c);}
    else if(k==='shop-csv'){name=fname(c,'csv','-shopping-list');data=shopCSV(c);}
    else if(k==='zip'){if(!window.JSZip)throw new Error('ZIP library not loaded');const z=new JSZip(),b=fname(c,'x').slice(0,-2);
      z.file(b+'.svg',exportSVG(c));z.file(b+'-components.csv',compCSV(c));z.file(b+'-pin-to-pin.csv',ppCSV(c));z.file(b+'-bom.csv',bomCSV(c));z.file(b+'-shopping-list.csv',shopCSV(c));z.file(b+'-firmware.json',fwJSON(c));
      z.file('README.txt',`${c.title}\nStatus: ${vcache(c).status}\n${vcache(c).why}\nGenerated from stored component and connection data. Preliminary: compare with datasheets before wiring.\n`);
      try{z.file(b+'.pdf',await pdfBlob(c));}catch(e){}
      name=b+'-project.zip';data=await z.generateAsync({type:'blob'});}
    await saveFile(name,data);toast('Saved '+name);
  }catch(e){if(e&&e.code==='declined')return;toast('Export failed: '+((e&&e.message)||'unknown error'));}
}
/* boot */
(async()=>{try{DL=window.claude?await claude.use('downloads'):null;}catch(e){DL=null;}})();
render();
